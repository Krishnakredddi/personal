<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thank You – [[${event.title}]]</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- cache-bust so new CSS really loads -->
    <link rel="stylesheet" th:href="@{/css/theme.css(v=${#dates.createNow().time})}" />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script>
        // Match overlay aspect to the actual poster PNG (prevents phone drift)
        addEventListener('DOMContentLoaded', () => {
            const img = document.querySelector('.bg-poster img');
            const root = document.documentElement;
            const apply = () => {
                if (img && img.naturalWidth && img.naturalHeight) {
                    root.style.setProperty('--poster-w', img.naturalWidth);
                    root.style.setProperty('--poster-h', img.naturalHeight);
                }
            };
            if (img) { img.complete ? apply() : img.addEventListener('load', apply, { once:true }); }
        });
    </script>
</head>

<body class="page-sky page-thanks">
<div class="bg-poster"><img src="/images/bg-invite.png" alt="" aria-hidden="true"></div>

<div class="balloons-layer" aria-hidden="true">
    <span class="balloon" style="--x:12%; --size:90px;  --dur:28s; --delay:-4s"></span>
    <span class="balloon" style="--x:28%; --size:70px;  --dur:24s; --delay:-10s"></span>
    <span class="balloon" style="--x:50%; --size:95px;  --dur:30s; --delay:-2s"></span>
    <span class="balloon" style="--x:68%; --size:80px;  --dur:26s; --delay:-7s"></span>
    <span class="balloon" style="--x:86%; --size:60px;  --dur:22s; --delay:-12s"></span>
</div>

<div class="poster-overlay">
    <div class="cloud-slot center-stack">
        <h1 class="text-3xl font-bold halo">
            Thank you<span th:if="${name != null && !#strings.isEmpty(name)}" th:text="' , ' + ${name}"></span>! 🎉
        </h1>

        <p class="thanks-text">Your RSVP has been recorded.</p>
        <p class="thanks-text">We can’t wait to celebrate!</p><br>

        <div class="thanks-text">Venue</div>
        <p class="thanks-text">
            <b th:text="${event.venue}">HMS Banquet Hall</b> <br>
            <span th:text="${event.address}">Ajax Community Centre, 75 Centennial Rd, Ajax, ON</span>
        </p>

        <div class="row mt-4">
            <a th:href="@{/}" class="btn btn-primary">Back to Invite</a>
        </div>
    </div>
</div>
</body>
</html>
