<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- RSVP form (reused by index) -->
<div th:fragment="rsvpForm(form)">
    <form id="rsvpForm" hx-post="/rsvp" hx-target="#rsvp-card" hx-swap="outerHTML" class="space-y-3">
        <div>
            <label class="block text-sm font-medium">Full Name *</label>
            <input name="name" th:value="${form.name}" required class="input"/>
        </div>
        <div>
            <label class="block text-sm font-medium">Email *</label>
            <input name="email" type="email" th:value="${form.email}" required class="input"/>
        </div>
        <div>
            <label class="block text-sm font-medium">Phone (optional)</label>
            <input name="phone" th:value="${form.phone}" class="input"/>
        </div>
        <div>
            <label class="block text-sm font-medium">Number of Guests *</label>
            <input name="guestCount" type="number" min="1" th:value="${form.guestCount}" required class="input"/>
            <p class="text-xs text-slate-500">Include yourself in this count.</p>
        </div>
        <div>
            <label class="block text-sm font-medium">Notes</label>
            <textarea name="notes" rows="3" th:text="${form.notes}" class="input"></textarea>
        </div>
        <button class="btn-primary w-full">Submit RSVP</button>
        <p class="text-xs text-slate-500">We’ll send the host a notification.</p>
    </form>
</div>

<!-- Success fragment returned by /rsvp -->
<div th:fragment="rsvpSuccess">
    <div id="rsvp-card" class="card">
        <h3 class="text-lg font-semibold mb-2">RSVP Received 🎉</h3>
        <p th:text="'Thanks, ' + ${name} + '! We look forward to seeing you.'"></p>
        <a href="/ics" class="btn-secondary mt-3 inline-block">Add to Calendar</a>
    </div>
    <script> if(window.confettiBurst){confettiBurst();} </script>
</div>
</body>
</html>
